[package]
name = "keysas-usbfilter-trayapp"
version = "0.1.0"
description = "Keysas USB firewall tray application"
authors = ["Luc Bonnafoux", "Stephane N"]
license = "GPL-3.0"
repository = ""
default-run = "keysas-usbfilter-trayapp"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
simple_logger = "4.1"
log = "0.4"
cfg-if = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "3.14", features = ["blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
libmailslot = { path = "../../libmailslot" }

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.48.0"
features = [
    "Win32_Foundation",
]
