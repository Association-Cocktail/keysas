[package]
name = "keysas-usbfilter-daemon"
version = "0.1.0"
description = "Keysas USB firewall daemon"
authors = ["Luc Bonnafoux", "Stephane N"]
license = "GPL-3.0"
repository = ""
default-run = "keysas-usbfilter-daemon"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
widestring = "1.0"
anyhow = "1.0"
log = "0.4"
wchar = "0.11"
mbrman = "0.5"
libc = "0.2"
keysas_lib = { path = "../../keysas_lib" }
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
clap = { version = "4", default-features = false, features = ["std", "cargo"] }
toml = "0.8"
x509-cert = "0.2"
cfg-if = "1.0"
base64 = "0.21"
oqs = { version = "0.11", default-features = false, features = ["ml_dsa"] }
ed25519-dalek = "2"
rust-i18n = "2"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
udev = "0.8"
simple_logger = "4.1"
zbus_polkit = "3.0"
zbus = "3.14"

# ─────────────────────────────────────────────────────────────────────────────
# Packaging Debian — cargo-deb
# Build : cargo install cargo-deb && cargo deb
# ─────────────────────────────────────────────────────────────────────────────
[package.metadata.deb]
name            = "keysas-firewall"
maintainer      = "Association Cocktail <contact@asso-cocktail.fr>"
copyright       = "2023-2024, Keysas contributors"
license-file    = ["../../LICENSE", "0"]
extended-description = """\
Keysas USB Firewall daemon for Linux.
Controls USB device access via udev rules and kernel USB deauthorization.
Certified USB keys (signed by the Keysas admin CA) are mounted via udisks2
at the standard desktop path (/media/<user>/<label>) so they appear in the
file manager with graphical-eject support.
Uncertified USB keys are disconnected at the USB level."""
section         = "security"
priority        = "optional"
# $auto → détection automatique des .so via ldd (libc6, libudev1, …)
depends         = "$auto, systemd, udev, udisks2, util-linux"
recommends      = "bpftool"
conf-files      = ["/etc/keysas/firewall/keysas-firewall-conf.toml"]

assets = [
    # Binaire principal
    ["target/release/keysas-usbfilter-daemon", "usr/bin/", "755"],
    # Fichier de configuration exemple → conf-file
    ["pkg/keysas-firewall-conf.toml", "etc/keysas/firewall/keysas-firewall-conf.toml", "640"],
    # Unité systemd
    ["pkg/keysas-firewall.service", "lib/systemd/system/keysas-firewall.service", "644"],
    # Page de manuel (section 8 — administration système)
    ["pkg/keysas-usbfilter-daemon.8.gz", "usr/share/man/man8/keysas-usbfilter-daemon.8.gz", "644"],
    # Politique D-Bus (system bus)
    ["pkg/fr.asso-cocktail.keysas.Firewall1.conf", "etc/dbus-1/system.d/fr.asso-cocktail.keysas.Firewall1.conf", "644"],
    # Règle udev : bloque l'automount et débloque udisks2 après certification
    ["pkg/60-keysas-firewall.rules", "lib/udev/rules.d/60-keysas-firewall.rules", "644"],
    # Règle polkit : permet à udisksctl de monter sans agent interactif
    ["pkg/60-keysas-udisks2.rules", "usr/share/polkit-1/rules.d/60-keysas-udisks2.rules", "644"],
]

maintainer-scripts = "pkg/debian/"

[target.'cfg(target_os = "windows")'.dependencies]
libmailslot = {path = "../libmailslot"}
windows-service = "0.6"
eventlog = "0.2"
registry = "1.2"
simple_logger = "4.1"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_InstallableFileSystems",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem"
]

# ─────────────────────────────────────────────────────────────────────────────
# Packaging Windows MSI
#
# Option A — Windows host (cargo-wix + WiX Toolset v3):
#   cargo build --release --target x86_64-pc-windows-msvc
#   cargo wix --define BinDir=target/release --nocapture
#
# Option B — Linux / Docker (MinGW cross-compile + wixl):
#   docker build -f Dockerfile.msi --output dist/ .
#   → dist/keysas-firewall-<version>-x64.msi
# ─────────────────────────────────────────────────────────────────────────────
[package.metadata.wix]
upgrade-guid = "37C429B0-B7F9-47C6-B840-D55BD5024EE8"
path-guid    = "083D9238-6965-4411-90DA-DCA99FEA26C5"
eula         = false
# wix/main.wxs is used instead of the auto-generated template
