[package]
name = "keysas-usbfilter-daemon"
version = "0.1.0"
description = "Keysas USB firewall daemon"
authors = ["Luc Bonnafoux", "Stephane N"]
license = "GPL-3.0"
repository = ""
default-run = "keysas-usbfilter-daemon"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
widestring = "1.0"
anyhow = "1.0"
log = "0.4"
wchar = "0.11"
mbrman = "0.5"
libc = "0.2"
keysas_lib = { path = "../../keysas_lib" }
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
clap = { version = "4", default-features = false, features = ["std", "cargo"] }
toml = "0.8"
x509-cert = "0.2"
cfg-if = "1.0"
base64 = "0.21"
oqs = { version = "0.9", default-features = false, features =["dilithium"] }
ed25519-dalek = "2"
rust-i18n = "2"

[target.'cfg(target_os = "linux")'.dependencies]
udev = "0.8"
simple_logger = "4.1"
aya = "0.11"
aya-log = "0.1"
tokio = { version = "1.34", features = ["rt-multi-thread", "time", "macros"] }
zbus_polkit = "3.0"
zbus = "3.14"

# ─────────────────────────────────────────────────────────────────────────────
# Packaging Debian — cargo-deb
# Build : cargo install cargo-deb && cargo deb
# ─────────────────────────────────────────────────────────────────────────────
[package.metadata.deb]
name            = "keysas-firewall"
maintainer      = "Association Cocktail <contact@asso-cocktail.fr>"
copyright       = "2023-2024, Keysas contributors"
license-file    = ["../../../LICENSE", "0"]
extended-description = """\
Keysas USB Firewall daemon for Linux.
Controls USB device access via an eBPF LSM hook (file_open) and a udev monitor.
Only USB keys signed by the Keysas admin CA are granted read or read/write access;
all others are blocked at the kernel level."""
section         = "security"
priority        = "optional"
# $auto → détection automatique des .so via ldd (libc6, libudev1, …)
depends         = "$auto, systemd"
recommends      = "bpftool"
conf-files      = ["/etc/keysas/firewall/keysas-firewall-conf.toml"]

assets = [
    # Binaire principal
    ["target/release/keysas-usbfilter-daemon", "usr/bin/", "755"],
    # Fichier de configuration exemple → conf-file
    ["pkg/keysas-firewall-conf.toml", "etc/keysas/firewall/keysas-firewall-conf.toml", "640"],
    # Unité systemd
    ["pkg/keysas-firewall.service", "lib/systemd/system/keysas-firewall.service", "644"],
    # Page de manuel (section 8 — administration système)
    ["pkg/keysas-usbfilter-daemon.8.gz", "usr/share/man/man8/keysas-usbfilter-daemon.8.gz", "644"],
    # Politique D-Bus (system bus)
    ["pkg/fr.asso-cocktail.keysas.Firewall1.conf", "etc/dbus-1/system.d/fr.asso-cocktail.keysas.Firewall1.conf", "644"],
]

maintainer-scripts = "pkg/debian/"

[package.metadata.deb.systemd-units]
unit-name = "keysas-firewall"
enable    = false   # l'admin active manuellement après avoir fourni les certificats
start     = false

[target.'cfg(target_os = "windows")'.dependencies]
libmailslot = {path = "../libmailslot"}
windows-service = "0.6"
eventlog = "0.2"
registry = "1.2"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_InstallableFileSystems",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem"
]