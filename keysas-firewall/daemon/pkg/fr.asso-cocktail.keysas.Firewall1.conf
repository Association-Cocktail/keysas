<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus system bus policy for keysas-firewall.

  Two rules grant access to fr.asso_cocktail.keysas.Firewall1:

  1. at_console="true" — any user with an active graphical/console session
     (determined by logind).  This covers the standard desktop scenario where
     the tray-app runs as the logged-in user without extra group management.

  2. group="keysas" — explicit opt-in for headless or multi-user deployments
     where no console session is present (e.g. remote administration).
     Add users with: usermod -aG keysas <username>  (re-login required).
-->
<busconfig>
  <!-- The daemon (root) may own the well-known name -->
  <policy user="root">
    <allow own="fr.asso_cocktail.keysas.Firewall1"/>
  </policy>

  <!-- Desktop user: any user with an active logind/console session -->
  <policy at_console="true">
    <allow send_destination="fr.asso_cocktail.keysas.Firewall1"
           send_interface="fr.asso_cocktail.keysas.Firewall1"/>
  </policy>

  <!-- Headless / multi-user: explicit keysas group membership -->
  <policy group="keysas">
    <allow send_destination="fr.asso_cocktail.keysas.Firewall1"
           send_interface="fr.asso_cocktail.keysas.Firewall1"/>
  </policy>
</busconfig>
