<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus system bus policy for keysas-firewall.

  Grants members of the 'keysas' group the right to call methods on
  fr.asso_cocktail.keysas.Firewall1 (owned by the root-running daemon).
  This allows the tray-app running as a normal user to query device state
  and push authorization updates without requiring extra privileges.
-->
<busconfig>
  <!-- The daemon (root) may own the well-known name -->
  <policy user="root">
    <allow own="fr.asso_cocktail.keysas.Firewall1"/>
  </policy>

  <!-- Members of the 'keysas' group may call any method on the service -->
  <policy group="keysas">
    <allow send_destination="fr.asso_cocktail.keysas.Firewall1"
           send_interface="fr.asso_cocktail.keysas.Firewall1"/>
  </policy>
</busconfig>
