name: keysas-admin CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - keysas-admin/**
      - .github/workflows/keysas-admin.yml
  push:
    branches: [main, develop]
    paths:
      - keysas-admin/**
      - .github/workflows/keysas-admin.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. cargo check — vérifie que le code Rust compile sans erreur
  # ─────────────────────────────────────────────────────────────────────────────
  check:
    name: cargo check (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Install system dependencies
        run: |
          sudo apt-get update -yq
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: admin-${{ runner.os }}-${{ hashFiles('keysas-admin/src-tauri/Cargo.lock') }}
          restore-keys: admin-${{ runner.os }}-

      - name: Create stub frontend dist
        run: mkdir -p keysas-admin/dist

      - name: cargo check
        working-directory: keysas-admin/src-tauri
        run: cargo check

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build .deb — produit le paquet installable
  #    fakeroot : contourne le bug Tauri (champ GID mal formaté pour les
  #    utilisateurs de domaine) en exposant uid=0/gid=0 lors du build.
  # ─────────────────────────────────────────────────────────────────────────────
  build-deb:
    name: Build .deb (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: keysas-admin/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update -yq
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            pkg-config \
            fakeroot

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: admin-${{ runner.os }}-${{ hashFiles('keysas-admin/src-tauri/Cargo.lock') }}
          restore-keys: admin-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: keysas-admin
        run: npm ci

      - name: Build .deb
        working-directory: keysas-admin
        run: fakeroot npx tauri build --bundles deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: keysas-admin-deb
          path: keysas-admin/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
