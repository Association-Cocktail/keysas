name: keysas-firewall CI

# Triggered on PRs and pushes to main/develop when firewall sources change.
on:
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "keysas-firewall/**"
      - ".github/workflows/keysas-firewall.yml"
  push:
    branches: ["main", "develop"]
    paths:
      - "keysas-firewall/**"
      - ".github/workflows/keysas-firewall.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build the eBPF kernel program (nightly, bpf-linker, bpf target)
  #    The compiled binary is uploaded so the daemon job can embed it.
  # ─────────────────────────────────────────────────────────────────────────────
  build-ebpf:
    name: Build eBPF program
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Rust nightly + rust-src
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: nightly
          components: rust-src
          rustflags: ""  # vmlinux.rs is auto-generated — don't treat warnings as errors

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ebpf-${{ runner.os }}-${{ hashFiles('keysas-firewall/ebpfilter/lsm-file-ebpf/Cargo.lock') }}
          restore-keys: ebpf-${{ runner.os }}-

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Build eBPF (debug)
        working-directory: keysas-firewall/ebpfilter/lsm-file-ebpf
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo build --target bpfel-unknown-none -Z build-std=core

      - name: Upload eBPF binary
        uses: actions/upload-artifact@v4
        with:
          name: lsm-file-ebpf-debug
          path: keysas-firewall/ebpfilter/target/bpfel-unknown-none/debug/lsm-file
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Check the daemon (Linux only)
  #    Requires the eBPF binary embedded via include_bytes_aligned!
  # ─────────────────────────────────────────────────────────────────────────────
  check-daemon:
    name: cargo check — daemon (Linux)
    runs-on: ubuntu-latest
    needs: build-ebpf

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: nightly

      - name: Download eBPF binary
        uses: actions/download-artifact@v4
        with:
          name: lsm-file-ebpf-debug
          path: keysas-firewall/ebpfilter/target/bpfel-unknown-none/debug/

      - name: Install system dependencies (daemon)
        run: |
          sudo apt-get update -yq
          sudo apt-get install -y \
            libudev-dev \
            clang \
            llvm \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: daemon-${{ runner.os }}-${{ hashFiles('keysas-firewall/daemon/Cargo.lock') }}
          restore-keys: daemon-${{ runner.os }}-

      - name: cargo check
        working-directory: keysas-firewall/daemon
        run: cargo check

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Check the tray-app (Linux)
  #    Independent of the daemon — no eBPF binary required.
  # ─────────────────────────────────────────────────────────────────────────────
  check-tray-app:
    name: cargo check — tray-app (Linux)
    # Tauri 1.x uses wry ~0.24 which requires webkit2gtk-4.0 (dropped in Ubuntu 24.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: stable
          rustflags: ""  # Don't treat warnings as errors on the tray-app check

      - name: Install system dependencies (tray-app / Tauri)
        run: |
          sudo apt-get update -yq
          sudo apt-get install -y \
            libsoup2.4-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libjavascriptcoregtk-4.0-dev \
            libayatana-appindicator3-dev \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: trayapp-${{ runner.os }}-${{ hashFiles('keysas-firewall/tray-app/src-tauri/Cargo.lock') }}
          restore-keys: trayapp-${{ runner.os }}-

      - name: Create stub frontend dist (required by generate_context!)
        run: mkdir -p keysas-firewall/tray-app/dist

      - name: cargo check
        working-directory: keysas-firewall/tray-app/src-tauri
        run: cargo check

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Build the tray-app MSI (Windows)
  #    Uses Tauri v1 + WiX v3 (downloaded automatically by Tauri).
  #    Produces a .msi installer for the tray-app only (no kernel drivers).
  # ─────────────────────────────────────────────────────────────────────────────
  build-tray-app-msi:
    name: Build tray-app MSI (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: stable
          rustflags: ""  # Don't treat warnings as errors on MSI build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: keysas-firewall/tray-app/package-lock.json

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: msi-${{ runner.os }}-${{ hashFiles('keysas-firewall/tray-app/src-tauri/Cargo.lock') }}
          restore-keys: msi-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: keysas-firewall/tray-app
        run: npm ci

      - name: Build MSI (tauri build)
        working-directory: keysas-firewall/tray-app
        run: npm run tauri build -- --bundles msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: keysas-firewall-msi
          path: keysas-firewall/tray-app/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7
