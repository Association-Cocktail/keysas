name: keysas-firewall CI

# Triggered on PRs and pushes to main/develop when firewall sources change.
on:
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "keysas-firewall/**"
      - ".github/workflows/keysas-firewall.yml"
  push:
    branches: ["main", "develop"]
    paths:
      - "keysas-firewall/**"
      - ".github/workflows/keysas-firewall.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build the eBPF kernel program (nightly, bpf-linker, bpf target)
  #    The compiled binary is uploaded so the daemon job can embed it.
  # ─────────────────────────────────────────────────────────────────────────────
  build-ebpf:
    name: Build eBPF program
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Rust nightly + rust-src
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: nightly
          components: rust-src
          rustflags: ""  # vmlinux.rs is auto-generated — don't treat warnings as errors

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ebpf-${{ runner.os }}-${{ hashFiles('keysas-firewall/ebpfilter/lsm-file-ebpf/Cargo.lock') }}
          restore-keys: ebpf-${{ runner.os }}-

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Build eBPF (debug)
        working-directory: keysas-firewall/ebpfilter/lsm-file-ebpf
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo build --target bpfel-unknown-none -Z build-std=core

      - name: Upload eBPF binary
        uses: actions/upload-artifact@v4
        with:
          name: lsm-file-ebpf-debug
          path: keysas-firewall/ebpfilter/target/bpfel-unknown-none/debug/lsm-file
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Check the daemon (Linux only)
  #    Requires the eBPF binary embedded via include_bytes_aligned!
  # ─────────────────────────────────────────────────────────────────────────────
  check-daemon:
    name: cargo check — daemon (Linux)
    runs-on: ubuntu-latest
    needs: build-ebpf

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: nightly
          rustflags: ""  # Don't treat warnings as errors on the daemon check

      - name: Download eBPF binary
        uses: actions/download-artifact@v4
        with:
          name: lsm-file-ebpf-debug
          path: keysas-firewall/ebpfilter/target/bpfel-unknown-none/debug/

      - name: Install system dependencies (daemon)
        run: |
          sudo apt-get update -yq
          sudo apt-get install -y \
            libudev-dev \
            clang \
            llvm \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: daemon-${{ runner.os }}-${{ hashFiles('keysas-firewall/daemon/Cargo.lock') }}
          restore-keys: daemon-${{ runner.os }}-

      - name: cargo check
        working-directory: keysas-firewall/daemon
        run: cargo check

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Check the tray-app (Linux)
  #    Independent of the daemon — no eBPF binary required.
  # ─────────────────────────────────────────────────────────────────────────────
  check-tray-app:
    name: cargo check — tray-app (Linux)
    # Tauri 1.x uses wry ~0.24 which requires webkit2gtk-4.0 (dropped in Ubuntu 24.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: stable
          rustflags: ""  # Don't treat warnings as errors on the tray-app check

      - name: Install system dependencies (tray-app / Tauri)
        run: |
          sudo apt-get update -yq
          sudo apt-get install -y \
            libsoup2.4-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libjavascriptcoregtk-4.0-dev \
            libayatana-appindicator3-dev \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: trayapp-${{ runner.os }}-${{ hashFiles('keysas-firewall/tray-app/src-tauri/Cargo.lock') }}
          restore-keys: trayapp-${{ runner.os }}-

      - name: Create stub frontend dist (required by generate_context!)
        run: mkdir -p keysas-firewall/tray-app/dist

      - name: cargo check
        working-directory: keysas-firewall/tray-app/src-tauri
        run: cargo check

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Build the tray-app MSI (Windows)
  #    Uses Tauri v1 + WiX v3 (downloaded automatically by Tauri).
  #    Produces a .msi installer for the tray-app only (no kernel drivers).
  # ─────────────────────────────────────────────────────────────────────────────
  build-tray-app-msi:
    name: Build tray-app MSI (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: stable
          rustflags: ""  # Don't treat warnings as errors on MSI build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: keysas-firewall/tray-app/package-lock.json

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: msi-${{ runner.os }}-${{ hashFiles('keysas-firewall/tray-app/src-tauri/Cargo.lock') }}
          restore-keys: msi-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: keysas-firewall/tray-app
        run: npm ci

      - name: Build MSI (tauri build)
        working-directory: keysas-firewall/tray-app
        run: npm run tauri build -- --bundles msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: keysas-firewall-msi
          path: keysas-firewall/tray-app/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Build the full MSI : minifilter (WDK) + daemon (MSVC) + packaging (WiX v3)
  #    Everything on one Windows runner — no cross-compilation, no Docker.
  #
  #    Driver signing: self-signed (test) by default.
  #    For production, set repository secrets EV_CERT_PFX + EV_CERT_PASSWORD
  #    and replace the "Self-sign" step with a signtool /f cert.pfx call.
  #
  #    Target machine requirement (test-signed driver):
  #      bcdedit /set testsigning on  (+ reboot) before installing the MSI.
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows-msi:
    name: Build MSI daemon+minifilter (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      # ── Toolchain setup ────────────────────────────────────────────────────
      - name: Set up Rust stable (MSVC)
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: stable
          rustflags: ""

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: win-msi-${{ hashFiles('keysas-firewall/daemon/Cargo.lock') }}
          restore-keys: win-msi-

      # ── Windows Driver Kit ─────────────────────────────────────────────────
      - name: Install Windows Driver Kit
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2249371" `
            -OutFile "$env:TEMP\wdksetup.exe" -UseBasicParsing
          Start-Process -Wait "$env:TEMP\wdksetup.exe" "/quiet /norestart"
          # Vérifie que fltKernel.h est bien présent
          $km = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" `
            -Recurse -Filter "fltKernel.h" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $km) { throw "fltKernel.h introuvable après installation WDK" }
          Write-Host "fltKernel.h found: $km"
          $wdkVer = ($km -split "\\Include\\")[1].Split("\")[0]
          "WDK_VERSION=$wdkVer" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── WDK integration fix (CRITIQUE) ───────────────────────────────────────
      - name: Fix WDK MSBuild integration
        shell: pwsh
        run: |
          $wdkRoot = "C:\Program Files (x86)\Windows Kits\10"

          Write-Host "Searching for WindowsDriverKit.props..."
          $props = Get-ChildItem $wdkRoot -Recurse -Filter WindowsDriverKit.props -ErrorAction SilentlyContinue | Select-Object -First 1
          $targets = Get-ChildItem $wdkRoot -Recurse -Filter WindowsDriverKit.targets -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $props -or -not $targets) {
            throw "WDK props/targets not found"
          }

          Write-Host "Found props: $($props.FullName)"
          Write-Host "Found targets: $($targets.FullName)"

          # VCTargetsPath is an MSBuild-internal property, NOT a Windows environment
          # variable — $env:VCTargetsPath is always empty on GitHub runners.
          # Resolve it via vswhere.exe (pre-installed on windows-latest).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $vsInstallDir = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsInstallDir) { throw "Visual Studio installation not found via vswhere.exe" }
          Write-Host "VS install dir: $vsInstallDir"

          $VCTargetsPath = Join-Path $vsInstallDir "MSBuild\Microsoft\VC\v170\"
          $dest = Join-Path $VCTargetsPath "BuildCustomizations"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          Copy-Item $props.FullName "$dest\WindowsDriverKit.props" -Force
          Copy-Item $targets.FullName "$dest\WindowsDriverKit.targets" -Force

          Write-Host "WDK integration installed into $dest"

      # ── Minifilter ─────────────────────────────────────────────────────────
      - name: Build minifilter (Release x64)
        shell: pwsh
        working-directory: keysas-firewall/minifilter
        run: |
          $wdkRoot = "C:\Program Files (x86)\Windows Kits\10\"
          msbuild KeysasMinifilter.vcxproj /pp:out.xml `
            /p:Configuration=Release /p:Platform=x64 `
            /p:WDKContentRoot="$wdkRoot" `
            /v:minimal

      - name: Generate catalog file (inf2cat)
        shell: pwsh
        run: |
          $inf2cat = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter inf2cat.exe -ErrorAction SilentlyContinue |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $inf2cat) { throw "inf2cat.exe not found" }

          $outDir = "keysas-firewall\minifilter\x64\Release\KeysasMinifilter"
          Copy-Item "keysas-firewall\minifilter\KeysasMinifilter.inf" $outDir -Force
          & $inf2cat /driver:"$outDir" /os:10_X64,Server10_X64
          if ($LASTEXITCODE -ne 0) { throw "inf2cat failed" }

      - name: Self-sign driver and catalog (test signing)
        shell: pwsh
        run: |
          $outDir  = "keysas-firewall\minifilter\x64\Release\KeysasMinifilter"
          $cert    = New-SelfSignedCertificate -Type CodeSigningCert `
                       -Subject "CN=Keysas Test Signing" `
                       -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
                        -Recurse -Filter signtool.exe |
                        Where-Object { $_.FullName -match "x64" } |
                        Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool sign /fd SHA256 /s My /sha1 $cert.Thumbprint `
            /t http://timestamp.digicert.com `
            "$outDir\KeysasMinifilter.sys" "$outDir\KeysasMinifilter.cat"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

      # ── Daemon ─────────────────────────────────────────────────────────────
      - name: Build daemon (Release MSVC)
        working-directory: keysas-firewall/daemon
        run: cargo build --release --target x86_64-pc-windows-msvc

      # ── Tray-app ───────────────────────────────────────────────────────────
      - name: Set up Node.js (tray-app frontend)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: keysas-firewall/tray-app/package-lock.json

      - name: Build tray-app frontend
        working-directory: keysas-firewall/tray-app
        run: npm ci && npm run build

      - name: Build tray-app binary (Release MSVC)
        working-directory: keysas-firewall/tray-app/src-tauri
        run: cargo build --release --target x86_64-pc-windows-msvc

      # ── MSI packaging (WiX v3, pre-installed on windows-latest) ───────────
      - name: Install cargo-wix
        run: cargo install --locked cargo-wix

      - name: Package MSI (cargo wix)
        shell: pwsh
        working-directory: keysas-firewall/daemon
        run: |
          cargo wix `
            --define BinDir=target\x86_64-pc-windows-msvc\release `
            --define MinifilterDir=..\minifilter\x64\Release\KeysasMinifilter `
            --define TrayAppBinDir=..\tray-app\src-tauri\target\x86_64-pc-windows-msvc\release `
            --nocapture

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: keysas-firewall-full-msi
          path: keysas-firewall/daemon/target/wix/*.msi
          retention-days: 7
